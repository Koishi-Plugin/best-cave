<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>回声洞在线预览</title>
<style>
:root{
  --bg:#f2f3f5; --card:#fff; --ink:#1a2029; --muted:#6b7381; --line:#e0e4ea;
  --accent:#2c66e0; --del:#cf2f43; --rev:#b0650f; --keep:#0f7a57; --chip:#edf0f5;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Segoe UI","Microsoft YaHei",system-ui,sans-serif}

.bar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:8px;flex-wrap:nowrap;
  padding:9px 16px;background:rgba(242,243,245,.96);backdrop-filter:blur(5px);
  border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
.bar h1{font-size:16.5px;margin:0;white-space:nowrap;letter-spacing:.3px}
.stat{font-size:13px;color:var(--muted);flex:0 1 auto;min-width:120px;font-variant-numeric:tabular-nums;text-align:right}
.stat b{color:var(--ink);font-weight:600}
.spacer{flex:1 1 14px;min-width:6px}
.div{flex:0 0 auto;width:1px;height:20px;background:var(--line)}
button,select,input{font:inherit;color:inherit}
button{flex:0 0 auto;height:31px;border:1px solid var(--line);background:#fff;padding:0 12px;border-radius:8px;cursor:pointer;font-size:13.5px;white-space:nowrap}
button:hover:not(:disabled){border-color:#aeb9cb;background:#f7f9fc}
.ctl{display:inline-flex;align-items:center;gap:6px;flex:0 1 auto;height:31px;padding:0 5px 0 10px;background:#fff;border:1px solid var(--line);border-radius:8px}
.ctl:focus-within{border-color:#aeb9cb;background:#f7f9fc}
.ctl i{font-style:normal;font-size:12.5px;color:var(--muted);white-space:nowrap}
.ctl select,.ctl input{flex:0 1 auto;width:auto;min-width:0;height:100%;border:0;background:transparent;padding:0 2px;font-size:13.5px;outline:none}
.ctl select{cursor:pointer;max-width:92px}
.ctl:has(input){flex:1 1 118px;min-width:104px}
.ctl input{flex:1 1 auto}
.grp{display:flex;flex:0 0 auto}
.grp button{border-radius:0;border-right-width:0}
.grp button:first-child{border-radius:8px 0 0 8px}
.grp button:last-child{border-radius:0 8px 8px 0;border-right-width:1px}
.grp button+button{border-left-color:#eef1f5}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
button.pri:hover:not(:disabled){background:#2155bd}

main{padding:16px}
#cols{display:flex;gap:14px;align-items:flex-start}
.col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:14px}

.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:11px;display:flex;flex-direction:column;overflow:hidden;cursor:pointer}
.card:hover{border-color:#b9c4d6;box-shadow:0 2px 10px rgba(20,30,50,.07)}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.card.sel::after{content:"已选择";position:absolute;top:0;right:0;background:var(--accent);color:#fff;font-size:11.5px;line-height:1;padding:4px 9px;border-radius:0 10px 0 9px}
.card.sel .h1{padding-right:58px}
.card.v-del{border-top:4px solid var(--del)}
.card.v-review{border-top:4px solid var(--rev)}
.card.v-keep{border-top:4px solid var(--keep)}
.hd{display:flex;flex-direction:column;gap:3px;padding:9px 12px;border-bottom:1px solid var(--line);background:#fafbfc;user-select:none}
.h1{display:flex;align-items:baseline;gap:8px;min-width:0}
.h2{display:flex;align-items:baseline;gap:7px;font-size:12px;color:#8d97a5;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idx{font:600 15px/1.3 ui-monospace,Consolas,monospace}
.by{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}

.bd{padding:12px;display:flex;flex-direction:column;gap:11px}
.tx{font-size:15.5px;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere}
.mono{font-size:14px;line-height:1.7;background:#f6f7f9;border-radius:7px;padding:8px 10px;white-space:pre-wrap;overflow-wrap:anywhere}
.mg{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
.mg img,.mg video{width:100%;aspect-ratio:1/1;object-fit:cover;background:#f1f2f4;border:1px solid var(--line);border-radius:7px;display:block}
.mg .tag{grid-column:1/-1}
video{width:100%;max-height:420px;background:#0d0f12;border-radius:8px;display:block}
audio{width:100%}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:#4b5566;background:var(--chip);border-radius:7px;padding:4px 9px;word-break:break-all}
.tag a{color:var(--accent);text-decoration:none}
.fwd{border:1px solid var(--line);border-left:4px solid #c1cad9;border-radius:8px;padding:9px 11px;display:flex;flex-direction:column;gap:9px;background:#fbfcfd}
.fh{font-size:13px;color:var(--muted)}
.fnode{display:flex;flex-direction:column;gap:7px;padding-left:10px;border-left:1px dashed #dde2ea}
.fname{font-size:13px;color:#55606f;font-weight:600}
.chip{display:inline-block;font-size:13px;padding:3px 9px;border-radius:999px;background:var(--chip);color:#41506b;word-break:break-all}
.chip.bad{background:#f4e3e5;color:#8f2b36}
.none{font-size:13.5px;color:var(--muted);font-style:italic}

.ft{border-top:1px dashed var(--line);padding:10px 12px;background:#fcfcfd;font-size:14px;line-height:1.65;overflow-wrap:anywhere}
.ft .adv{color:#38414f}
.ft .rsn{color:var(--muted)}
.ft .adv + .rsn::before{content:"|";color:#b5bdca;margin:0 7px}
#more{display:flex;justify-content:center;padding:18px}
.hint{font-size:13.5px;color:var(--muted)}

#lb{position:fixed;inset:0;background:rgba(8,10,14,.95);z-index:100;display:none;align-items:center;justify-content:center;cursor:zoom-out}
#lb.open{display:flex}
#lb img,#lb video{max-width:92vw;max-height:88vh;object-fit:contain;cursor:auto}
#lb .cap{position:fixed;top:14px;left:16px;right:16px;color:#cfd6e0;font:13px ui-monospace,Consolas,monospace;text-align:center}
#lb .nav{position:fixed;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.1);color:#fff;border:0;font-size:30px;width:46px;height:66px;border-radius:9px;cursor:pointer}
#lb .nav:hover{background:rgba(255,255,255,.22)}
#lb .prev{left:12px}#lb .next{right:12px}
</style>
</head>
<body>

<div class="bar">
  <h1>回声洞在线预览</h1>
  <span class="div"></span>
  <label class="ctl"><i>搜索</i><input type="search" id="q"></label>
  <label class="ctl"><i>建议</i><select id="f-verdict"><option value="">全部</option></select></label>
  <label class="ctl"><i>群组</i><select id="f-ch"><option value="">全部</option></select></label>
  <label class="ctl"><i>排序</i><select id="sort"><option value="id-asc">升序</option><option value="id-desc">降序</option><option value="sev">建议</option></select></label>
  <span class="spacer"></span>
  <span id="stat" class="stat"></span>
  <span class="div"></span>
  <button id="b-pick">选择</button>
  <span class="grp"><button id="b-clearf">清空</button><button id="b-none">取消</button></span>
  <button id="b-cmd" class="pri">删除</button>
</div>
<input type="file" id="i-dir" webkitdirectory directory hidden>

<main>
  <div id="cols"></div>
  <div id="more"></div>
</main>

<div id="lb"><div class="cap" id="lb-cap"></div><button class="nav prev" id="lb-prev">&#8249;</button><div id="lb-body"></div><button class="nav next" id="lb-next">&#8250;</button></div>

<script data-cfasync="false">
"use strict";
const VLABEL = { keep: "保留", review: "待定", del: "删除" };
const CHUNK = 50, PAGE = 100;
const $ = s => document.querySelector(s);
const cols = $("#cols"), more = $("#more"), stat = $("#stat");
const lb = $("#lb"), lbBody = $("#lb-body"), lbCap = $("#lb-cap");

let caves = [], analysis = new Map(), vcnt = { keep: 0, review: 0, del: 0 };
let sel = new Set(), gone = new Set(), lastIdx = -1, view = [], shown = 0, byId = new Map();
let lbList = [], lbAt = 0, lbOwner = null;
let base = "", files = null, unhandled = 0;
const objUrls = new Map();

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = String(text);
  return n;
}

const debounce = (ms, fn) => { let t; return () => { clearTimeout(t); t = setTimeout(fn, ms); }; };

function mediaUrl(name) {
  if (!name) return "";
  if (files) {
    if (!objUrls.has(name)) {
      const f = files.get(name);
      if (!f) return "";
      objUrls.set(name, URL.createObjectURL(f));
    }
    return objUrls.get(name);
  }
  return base ? base + encodeURIComponent(name) : "";
}

/* ---------- 载入：数据取自页面同级目录，或由「选择」指定的目录 ---------- */

const textOf = async url => {
  const r = await fetch(url, { cache: "no-store" });
  if (!r.ok) throw new Error(String(r.status));
  return r.text();
};

async function load(read) {
  try { applyData(JSON.parse(await read("cave.json"))); } catch (e) { return; }
  try { setAnalysis(JSON.parse(await read("report.json"))); } catch (e) { setAnalysis(null); }
}

async function start() {
  base = new URL(".", location.href).href;
  await load(n => textOf(base + n));
}

async function pickFolder() {
  if (!window.showDirectoryPicker) return $("#i-dir").click();
  let root;
  try { root = await window.showDirectoryPicker({ id: "cave" }); } catch (e) { return; }
  const map = new Map();
  try {
    for await (const ent of root.values()) if (ent.kind === "file") map.set(ent.name, await ent.getFile());
  } catch (e) { return; }
  await useFolder(map);
}

async function useFolder(map) {
  if (!map.has("cave.json")) return;
  files = map; objUrls.clear(); base = "";
  await load(n => map.get(n).text());
}

/* ---------- 索引 ---------- */

function flatten(els, out, depth) {
  for (const e of els || []) {
    if (e.file) out.media.push(e);
    if (e.type === "text" && typeof e.content === "string") out.text.push(e.content);
    else if (e.type === "forward") for (const n of e.content || []) flatten(n.elements, out, depth + 1);
  }
  return out;
}

function normalize(c) {
  const f = flatten(c.elements, { media: [], text: [] }, 0);
  return Object.assign({}, c, {
    _media: f.media,
    _time: c.time ? new Date(c.time) : null,
    _q: (f.text.join(" ") + " " + (c.userName || "") + " " + c.id).toLowerCase()
  });
}

function applyData(data) {
  caves = data.map(normalize).sort((a, b) => a.id - b.id);
  sel.clear(); gone.clear();
  const cnt = new Map();
  for (const c of caves) {
    const k = String(c.channelId);
    cnt.set(k, (cnt.get(k) || 0) + 1);
  }
  const fc = $("#f-ch");
  fc.replaceChildren(new Option("全部", ""));
  for (const k of [...cnt.keys()].sort()) fc.append(new Option(k + " · " + cnt.get(k), k));
  const fv = $("#f-verdict");
  fv.replaceChildren(new Option("全部", ""), ...["del", "review", "keep"].map(k => new Option(VLABEL[k], k)));
  render();
}

function setAnalysis(obj) {
  analysis = new Map();
  vcnt = { keep: 0, review: 0, del: 0 };
  for (const it of (obj && obj.items) || []) {
    const a = { verdict: it.verdict || "keep", reason: it.reason || "", advice: it.advice || "" };
    analysis.set(it.id, a);
    vcnt[a.verdict]++;
  }
  render();
}

const eff = id => analysis.get(id) || null;
const verdict = c => (eff(c.id) || {}).verdict || "keep";

/* ---------- 筛选 ---------- */

function filtered() {
  const q = $("#q").value.trim().toLowerCase(), fv = $("#f-verdict").value, fc = $("#f-ch").value;
  const out = caves.filter(c => {
    if (gone.has(c.id)) return false;
    if (fc && String(c.channelId) !== fc) return false;
    if (fv && verdict(c) !== fv) return false;
    if (q) {
      const a = eff(c.id) || {};
      if (!(c._q.includes(q) || (a.reason || "").toLowerCase().includes(q) || (a.advice || "").toLowerCase().includes(q))) return false;
    }
    return true;
  });
  if ($("#sort").value === "id-desc") out.reverse();
  if ($("#sort").value === "sev") {
    const rank = { del: 0, review: 1, keep: 2 };
    out.sort((x, y) => rank[verdict(x)] - rank[verdict(y)] || y.id - x.id);
  }
  return out;
}

/* ---------- 瀑布流：按列高分配，图片加载后重排；重排时钉住容器高度，否则滚动位置会被夹回顶部 ---------- */

function colCount() {
  const w = document.documentElement.clientWidth - 32;
  return Math.max(1, Math.min(6, Math.floor(w / 320)));
}

function makeCols() {
  cols.replaceChildren();
  for (let i = 0; i < colCount(); i++) cols.append(el("div", "col"));
  return [...cols.children];
}

function shortest(columns) {
  return columns.reduce((a, b) => (b.offsetHeight < a.offsetHeight ? b : a));
}

function render() {
  view = filtered();
  byId.clear();
  lastIdx = -1;
  makeCols();
  shown = 0;
  page();
}

function page() {
  if (!caves.length) { more.replaceChildren(); paintStat(); return; }
  if (shown < view.length) {
    const columns = [...cols.children];
    const stop = Math.min(view.length, shown + PAGE);
    for (let i = shown; i < stop; i++) shortest(columns).append(card(view[i]));
    shown = stop;
  }
  if (shown < view.length) {
    const b = el("button", "", `加载更多（剩余 ${view.length - shown} 条）`);
    b.onclick = ev => { ev.stopPropagation(); page(); };
    more.replaceChildren(b);
    requestAnimationFrame(pump);
  } else {
    more.replaceChildren();
    if (!view.length) more.append(el("span", "hint", "无指定回声洞"));
  }
  paintStat();
}

function pump() {
  if (caves.length && shown < view.length && more.getBoundingClientRect().top < innerHeight + 800) page();
}

function relayout() {
  cols.style.minHeight = cols.offsetHeight + "px";
  const columns = makeCols();
  byId.forEach(box => shortest(columns).append(box));
  cols.style.minHeight = "";
}

const scheduleRelayout = debounce(260, () => { if (byId.size > colCount()) relayout(); });

/* ---------- 卡片 ---------- */

function card(c) {
  const a = eff(c.id);
  const box = el("article", "card" + (sel.has(c.id) ? " sel" : "") + (a ? " v-" + a.verdict : ""));
  byId.set(c.id, box);
  const hd = el("div", "hd");
  const h1 = el("div", "h1");
  h1.append(el("span", "idx", "#" + c.id), el("span", "by", c.userName || "未知"));
  const h2 = el("div", "h2");
  for (const v of new Set([c.userId, c.channelId].map(v => String(v ?? "")).filter(Boolean))) h2.append(el("span", "", v));
  if (c._time) h2.append(el("span", "", c._time.toLocaleString("zh-CN", { hour12: false, year: "numeric", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }).replace(/\//g, "-")));
  hd.append(h1, h2);
  box.append(hd, body(c));
  if (a && (a.reason || a.advice)) box.append(foot(a));
  box.onclick = e => {
    if (e.target.closest("img,video,audio,a,button")) return;
    toggle(c, view.indexOf(c), e.shiftKey);
  };
  box.querySelectorAll("img,video").forEach(m => m.onclick = e => { e.stopPropagation(); openLb(c, m.dataset.file); });
  box.querySelectorAll("img").forEach(im => {
    if (!im.complete) im.addEventListener("load", scheduleRelayout, { once: true });
    im.addEventListener("error", scheduleRelayout, { once: true });
  });
  return box;
}

function body(c) {
  const wrap = el("div", "bd");
  const nodes = renderEls(c.elements, 0);
  wrap.append(...(nodes.length ? nodes : [el("div", "none", "无可见内容")]));
  return wrap;
}

function renderEls(els, depth) {
  const out = [], nodes = els || [];
  for (let i = 0; i < nodes.length; i++) {
    const e = nodes[i];
    if (e.type === "image" || e.type === "video") {
      const run = [e];
      while (i + 1 < nodes.length && (nodes[i + 1].type === "image" || nodes[i + 1].type === "video")) run.push(nodes[++i]);
      out.push(mediaBlock(run));
      continue;
    }
    if (e.type === "text") { out.push(textBlock(e.content)); continue; }
    if (e.type === "forward") { out.push(forwardBlock(e, depth)); continue; }
    if (e.type === "audio" || e.type === "file") { out.push(fileBlock(e)); continue; }
    if (e.type === "reply") { out.push(el("span", "chip", "引用消息 " + String(e.content ?? ""))); continue; }
    if (e.type === "at") { out.push(el("span", "chip", "提及 " + String(e.content ?? ""))); continue; }
    if (e.type === "face" || e.type === "face_element") { out.push(el("span", "chip", "表情 " + String(e.content ?? e.id ?? ""))); continue; }
    unhandled++;
    out.push(el("span", "chip bad", "未识别元素 " + String(e.type) + "：" + String(e.content ?? e.file ?? "")));
  }
  return out;
}

function textBlock(content) {
  const s = String(content ?? "");
  if (!s.trim()) return el("span", "chip", "无文本内容");
  const lines = s.split("\n").length;
  return el("div", "tx" + (lines > 4 || s.length > 400 ? " mono" : ""), s);
}

function mediaNode(e) {
  const url = mediaUrl(e.file);
  if (!url) return el("span", "chip bad", "媒体文件缺失");
  const node = el(e.type === "video" ? "video" : "img");
  node.src = url; node.dataset.file = e.file;
  if (node.tagName === "VIDEO") { node.controls = true; node.preload = "metadata"; }
  else { node.loading = "lazy"; node.alt = e.file; }
  return node;
}

function mediaBlock(run) {
  if (run.length === 1) return mediaNode(run[0]);
  const box = el("div", "mg");
  for (const e of run) box.append(mediaNode(e));
  box.append(el("span", "tag", `共 ${run.length} 个媒体文件`));
  return box;
}

function forwardBlock(e, depth) {
  const box = el("div", "fwd");
  const nodes = e.content || [];
  box.append(el("div", "fh", `合并转发 ${nodes.length} 条` + (depth ? ` · 第 ${depth + 1} 层` : "")));
  nodes.forEach((n, i) => {
    const node = el("div", "fnode");
    node.append(el("span", "fname", `${n.userName || n.userId || "未知"} · ${i + 1}/${nodes.length}`));
    node.append(...renderEls(n.elements, depth + 1));
    box.append(node);
  });
  return box;
}

function fileBlock(e) {
  const box = el("div", "tag");
  box.append(el("span", "", `${e.type === "audio" ? "音频" : "附件"} ${e.file || ""}`));
  const url = mediaUrl(e.file);
  if (e.type === "audio" && url) { const a = el("audio"); a.src = url; a.controls = true; box.append(a); }
  else if (url) {
    const a = el("a", "", "新窗口打开");
    a.href = url; a.target = "_blank"; a.rel = "noopener";
    box.append(a);
  }
  return box;
}

function foot(a) {
  const ft = el("div", "ft");
  if (a.advice) ft.append(el("span", "adv", a.advice));
  if (a.reason) ft.append(el("span", "rsn", a.reason));
  return ft;
}

function paintStat() {
  if (!caves.length) { stat.replaceChildren(); return; }
  const hid = { keep: 0, review: 0, del: 0 };
  for (const id of gone) { const a = eff(id); if (a) hid[a.verdict]++; }
  const parts = [
    `已加载 ${shown} 条`, `共 ${view.length} 条`,
    `${VLABEL.del} ${vcnt.del - hid.del}`, `待定 ${vcnt.review - hid.review}`, `已选择 ${sel.size} 条`
  ];
  if (gone.size) parts.push(`已隐藏 ${gone.size} 条`);
  if (analysis.size && analysis.size !== caves.length) parts.push(`已判定 ${analysis.size} 条`);
  if (unhandled) parts.push(`未识别元素 ${unhandled} 个`);
  stat.replaceChildren();
  parts.forEach((t, i) => {
    if (i) stat.append(document.createTextNode(" · "));
    stat.append(el("b", "", t));
  });
}

/* ---------- 选择与删除指令 ---------- */

function toggle(c, idx, range) {
  let ids;
  if (range && lastIdx >= 0) {
    const [a, b] = idx < lastIdx ? [idx, lastIdx] : [lastIdx, idx];
    ids = view.slice(a, b + 1).map(v => v.id).filter(id => !gone.has(id));
    ids.forEach(id => sel.add(id));
  } else {
    sel.has(c.id) ? sel.delete(c.id) : sel.add(c.id);
    ids = [c.id];
    lastIdx = idx;
  }
  ids.forEach(id => byId.get(id)?.classList.toggle("sel", sel.has(id)));
  paintStat();
}

function clearSel() {
  sel.clear();
  lastIdx = -1;
  byId.forEach(box => box.classList.remove("sel"));
  paintStat();
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (e) {
    const t = el("textarea");
    t.value = text;
    t.style.cssText = "position:fixed;left:-9999px";
    document.body.append(t);
    t.select();
    const ok = document.execCommand("copy");
    t.remove();
    return ok;
  }
}

async function makeCmd() {
  const ids = [...sel].sort((a, b) => a - b);
  if (!ids.length) return alert("未选择回声洞");
  const lines = [];
  for (let i = 0; i < ids.length; i += CHUNK) lines.push(".cave -r " + ids.slice(i, i + CHUNK).join("|"));
  const text = lines.join("\n");
  if (!await copyText(text)) return alert(`复制失败：\n\n${text.slice(0, 300)}`);
  for (const id of ids) {
    gone.add(id);
    sel.delete(id);
    byId.get(id)?.remove();
    byId.delete(id);
  }
  view = view.filter(c => !gone.has(c.id));
  shown -= ids.length;
  lastIdx = -1;
  paintStat();
  alert(`已复制 ${lines.length} 条，隐藏 ${ids.length} 条`);
}

/* ---------- 大图 ---------- */

function openLb(owner, file) {
  lbOwner = owner;
  lbList = owner._media.filter(e => e.type === "image" || e.type === "video");
  lbAt = Math.max(0, lbList.findIndex(e => e.file === file));
  paintLb();
  lb.classList.add("open");
}
function paintLb() {
  const e = lbList[lbAt];
  if (!e) return;
  const node = el(e.type === "image" ? "img" : "video");
  node.src = mediaUrl(e.file);
  if (node.tagName === "VIDEO") { node.controls = true; node.autoplay = true; }
  lbBody.replaceChildren(node);
  lbCap.textContent = `#${lbOwner.id} · ${e.file} · ${lbAt + 1}/${lbList.length}`;
}
function stepLb(d) { lbAt = (lbAt + d + lbList.length) % lbList.length; paintLb(); }
function closeLb() { lb.classList.remove("open"); lbBody.replaceChildren(); }

/* ---------- 事件 ---------- */

$("#b-pick").onclick = pickFolder;
$("#i-dir").onchange = async e => {
  const map = new Map();
  for (const f of e.target.files) if (!map.has(f.name)) map.set(f.name, f);
  e.target.value = "";
  await useFolder(map);
};
for (const id of ["#f-verdict", "#f-ch", "#sort"]) $(id).onchange = render;
$("#q").oninput = debounce(200, render);
$("#b-clearf").onclick = () => { $("#q").value = ""; $("#f-verdict").value = ""; $("#f-ch").value = ""; gone.clear(); render(); };
$("#b-none").onclick = clearSel;
$("#b-cmd").onclick = makeCmd;
lb.onclick = e => { if (e.target === lb) closeLb(); };
$("#lb-prev").onclick = () => stepLb(-1);
$("#lb-next").onclick = () => stepLb(1);
document.addEventListener("keydown", e => {
  if (!lb.classList.contains("open")) return;
  if (e.key === "Escape") closeLb();
  if (e.key === "ArrowLeft") stepLb(-1);
  if (e.key === "ArrowRight") stepLb(1);
});
window.addEventListener("scroll", pump, { passive: true });
window.addEventListener("resize", debounce(250, () => { if (caves.length) render(); }));

start();
</script>
